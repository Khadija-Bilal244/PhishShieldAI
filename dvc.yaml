stages:
  ingest:
    desc: Download the PhiUSIIL phishing URL dataset from UCI and map it to the project schema
    cmd: python -m phishshield.data.ingest
    deps:
      - src/phishshield/data/ingest.py
      - src/phishshield/data/make_sample.py
    params:
      - seed
      - data
    outs:
      - data/raw/urls.csv
    metrics:
      - reports/ingest.json:
          cache: false

  validate:
    desc: Schema, null, range, format and duplicate checks - fails the pipeline on bad data
    cmd: python -m phishshield.data.validate
    deps:
      - src/phishshield/data/validate.py
      - data/raw/urls.csv
    params:
      - validation
    outs:
      - data/interim/urls_clean.csv
    metrics:
      - reports/data_validation.json:
          cache: false

  split:
    desc: Stratified train / validation / test split
    cmd: python -m phishshield.data.split
    deps:
      - src/phishshield/data/split.py
      - data/interim/urls_clean.csv
    params:
      - seed
      - split
    outs:
      - data/processed/train.csv
      - data/processed/val.csv
      - data/processed/test.csv
    metrics:
      - reports/split_summary.json:
          cache: false

  featurize:
    desc: 31 engineered lexical/host URL features + scaler fitted on train only
    cmd: python -m phishshield.features.build
    deps:
      - src/phishshield/features
      - data/processed/train.csv
      - data/processed/val.csv
      - data/processed/test.csv
    outs:
      - data/processed/train_features.csv
      - data/processed/val_features.csv
      - data/processed/test_features.csv
      - models/scaler.joblib

  train_baselines:
    desc: Baselines - Logistic Regression, Random Forest, XGBoost (MLflow-tracked)
    cmd: python -m phishshield.training.train_baselines
    deps:
      - src/phishshield/training/train_baselines.py
      - src/phishshield/models/baselines.py
      - data/processed/train_features.csv
      - data/processed/val_features.csv
    params:
      - seed
      - baselines
    outs:
      - models/baselines
      - reports/runs/baselines.json:
          cache: false
    metrics:
      - reports/baselines_val.json:
          cache: false

  train_hybrid:
    desc: Main model - hybrid DistilBERT + engineered-feature gated fusion (MLflow-tracked)
    cmd: python -m phishshield.training.train_hybrid
    deps:
      - src/phishshield/training/train_hybrid.py
      - src/phishshield/training/hybrid_trainer.py
      - src/phishshield/models/hybrid.py
      - src/phishshield/models/pyfunc.py
      - data/processed/train_features.csv
      - data/processed/val_features.csv
      - data/processed/test_features.csv
      - models/scaler.joblib
    params:
      - seed
      - hybrid
      - evaluation
    outs:
      - models/hybrid
      - reports/runs/hybrid.json:
          cache: false
    metrics:
      - reports/hybrid_metrics.json:
          cache: false
    plots:
      - reports/figures/hybrid_training_curve.png:
          cache: false

  evaluate:
    desc: Compare baselines vs main model on the held-out test set
    cmd: python -m phishshield.evaluation.evaluate
    deps:
      - src/phishshield/evaluation
      - models/baselines
      - models/hybrid
      - data/processed/test_features.csv
    outs:
      - reports/model_comparison.md:
          cache: false
    metrics:
      - reports/metrics.json:
          cache: false
    plots:
      - reports/figures/roc_curves.png:
          cache: false
      - reports/figures/confusion_matrices.png:
          cache: false

  register:
    desc: Register the main model (Staging) and the XGBoost baseline in the MLflow Model Registry
    cmd: python -m phishshield.registry.register
    deps:
      - src/phishshield/registry/register.py
      - reports/runs/hybrid.json
      - reports/runs/baselines.json
      - reports/metrics.json
    params:
      - mlflow
    outs:
      - reports/registry.json:
          cache: false

  ablation:
    desc: Ablation - text-only and features-only variants vs the fusion model (proposal 5.3)
    cmd: python -m phishshield.training.ablation
    deps:
      - src/phishshield/training/ablation.py
      - src/phishshield/training/hybrid_trainer.py
      - src/phishshield/models/hybrid.py
      - data/processed/train_features.csv
      - data/processed/val_features.csv
      - data/processed/test_features.csv
      - reports/hybrid_metrics.json
    params:
      - seed
      - hybrid
      - ablation
      - evaluation
    metrics:
      - reports/ablation.json:
          cache: false
    outs:
      - reports/ablation.md:
          cache: false
    plots:
      - reports/figures/ablation.png:
          cache: false

  distill:
    desc: Knowledge distillation - hybrid teacher -> CharCNN student -> ONNX (proposal 5.4)
    cmd: python -m phishshield.training.distill
    deps:
      - src/phishshield/training/distill.py
      - src/phishshield/training/calibration.py
      - src/phishshield/training/student_trainer.py
      - src/phishshield/models/student.py
      - src/phishshield/models/student_pyfunc.py
      - models/hybrid
      - models/scaler.joblib
      - data/processed/train_features.csv
      - data/processed/val_features.csv
      - data/processed/test_features.csv
    params:
      - seed
      - student
      - evaluation
      - explain.shap_background
    outs:
      - models/student
      - reports/runs/student.json:
          cache: false
    metrics:
      - reports/student_metrics.json:
          cache: false

  explain:
    desc: Integrated Gradients on the teacher + SHAP on engineered features
    cmd: python -m phishshield.explain.run
    deps:
      - src/phishshield/explain/run.py
      - src/phishshield/api/predictor.py
      - models/hybrid
      - models/student
      - data/processed/test_features.csv
    params:
      - explain
    outs:
      - reports/explanations.html:
          cache: false
      - reports/shap_importance.json:
          cache: false
    plots:
      - reports/figures/shap_summary.png:
          cache: false
  promote:
    desc: Register the student, validate vs champion, promote (MLflow Production) or reject (Archived)
    cmd: python -m phishshield.registry.promote
    deps:
      - src/phishshield/registry/promote.py
      - src/phishshield/registry/model_registry.py
      - src/phishshield/api/predictor.py
      - models/student
    params:
      - promotion
      - registry
    outs:
      - models/registry
    metrics:
      - reports/promotion.json:
          cache: false
  build_stream:
    desc: Reproducible drift stream - unseen PhiUSIIL URLs + growing share of new attack styles
    cmd: python -m phishshield.data.build_stream
    deps:
      - src/phishshield/data/build_stream.py
      - src/phishshield/data/make_sample.py
      - data/raw/urls.csv
    params:
      - seed
      - stream
    outs:
      - data/stream
    metrics:
      - reports/stream_summary.json:
          cache: false

  drift_eval:
    desc: Feature vs embedding drift detection + policy decision on every stream batch
    cmd: python -m phishshield.drift.drift_eval
    deps:
      - src/phishshield/drift
      - data/stream
      - models/student
      - reports/promotion.json
      - data/processed/train_features.csv
    params:
      - drift
      - promotion.max_fnr
    outs:
      - reports/drift_detection.md:
          cache: false
    metrics:
      - reports/drift_detection.json:
          cache: false
    plots:
      - reports/figures/drift_detection.png:
          cache: false

  strategy_comparison:
    desc: Static vs fixed-schedule vs tiered drift-aware updating (proposal 5.8)
    cmd: python -m phishshield.experiments.strategy_comparison
    deps:
      - src/phishshield/experiments/strategy_comparison.py
      - src/phishshield/training/calibration.py
      - src/phishshield/models/student.py
      - src/phishshield/training/student_trainer.py
      - src/phishshield/drift/risk_policy.py
      - src/phishshield/drift/feature_drift.py
      - src/phishshield/drift/embedding_drift.py
      - models/student
      - data/stream
      - data/processed/train_features.csv
    params:
      - seed
      - student
      - drift
      - experiment
      - promotion
    metrics:
      - reports/strategy_summary.json:
          cache: false
    outs:
      - reports/strategy_comparison.md:
          cache: false
      - reports/strategy_comparison.json:
          cache: false
    plots:
      - reports/figures/strategy_comparison.png:
          cache: false

  summary:
    desc: Collect every result table into reports/final_results.md
    cmd: python -m phishshield.reporting.summary
    deps:
      - src/phishshield/reporting/summary.py
      - reports/model_comparison.md
      - reports/ablation.md
      - reports/student_metrics.json
      - reports/drift_detection.md
      - reports/strategy_comparison.md
      - reports/shap_importance.json
      - reports/promotion.json
    outs:
      - reports/final_results.md:
          cache: false
