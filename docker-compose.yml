services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: phishshield-api:latest
    container_name: phishshield-api
    ports:
      - "8000:8000"
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN must be set in .env}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      - ./models/registry:/app/models/registry:ro
      - prod-logs:/app/data/production
    restart: unless-stopped
    networks: [phishnet]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: phishshield-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prom-data:/prometheus
    depends_on: [api]
    restart: unless-stopped
    networks: [phishnet]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: phishshield-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped
    networks: [phishnet]

volumes:
  prod-logs:
  prom-data:
  grafana-data:

networks:
  phishnet:
    name: phishnet
