seed: 42

data:
  source: phiusiil
  url: https://archive.ics.uci.edu/static/public/967/phiusiil+phishing+url+dataset.zip
  max_rows: 40000
  sample_size: 12000
  n_periods: 6

validation:
  required_columns: [url, label]
  min_url_length: 4
  max_url_length: 2048
  allowed_labels: [0, 1]
  min_rows: 1000
  min_class_ratio: 0.05
  max_duplicate_ratio: 0.10
  max_null_ratio: 0.01

split:
  test_size: 0.15
  val_size: 0.15

baselines:
  logistic_regression:
    C: 1.0
    max_iter: 2000
  random_forest:
    n_estimators: 300
    max_depth: 20
  xgboost:
    n_estimators: 400
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.9
    colsample_bytree: 0.9

hybrid:
  pretrained_name: distilbert-base-uncased
  debug_tiny: false
  mode: fusion
  max_len: 64
  batch_size: 32
  epochs: 3
  lr: 3.0e-5
  head_lr: 1.0e-3
  weight_decay: 0.01
  fusion_dim: 128
  dropout: 0.1
  max_train_samples: null
  freeze_layers_partial: 4

evaluation:
  max_fnr: 0.15

mlflow:
  experiment: phishshield-ai
  main_model_name: phishshield-hybrid
  baseline_model_name: phishshield-baseline-xgboost
  registry_stage: Staging

ablation:
  modes: [text_only, features_only]

student:
  max_len: 128
  embed_dim: 32
  num_filters: 64
  kernel_sizes: [3, 5, 7]
  epochs: 6
  batch_size: 128
  lr: 2.0e-3
  temperature: 2.0
  alpha: 0.5

explain:
  n_examples: 12
  shap_background: 50
  shap_samples: 300

promotion:
  primary_metric: f1
  min_improvement: 0.0
  max_recall_drop: 0.01
  max_fnr: 0.15

registry:
  student_model_name: phishshield-student

stream:
  pool_size: 20000
  n_batches: 8
  batch_size: 600
  max_new_style_share: 0.6

drift:
  psi_threshold: 0.2
  ks_pvalue: 0.01
  mmd_permutations: 200
  max_samples: 1000
  weights: {feature: 0.35, embedding: 0.35, performance: 0.30}
  tiers:
    recalibrate: 0.25
    partial_finetune: 0.45
    full_retrain: 0.65

experiment:
  fixed_schedule_every: 2

live:
  openphish_url: https://openphish.com/feed.txt
  tranco_url: https://tranco-list.eu/top-1m.csv.zip
  max_phishing: 1500
  tranco_top_n: 1500
