apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: phishshield-api
  namespace: phishshield
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: phishshield-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
