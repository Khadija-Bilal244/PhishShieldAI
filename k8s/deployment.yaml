apiVersion: v1
kind: Namespace
metadata:
  name: phishshield
---
apiVersion: v1
kind: Secret
metadata:
  name: phishshield-secrets
  namespace: phishshield
type: Opaque
stringData:
  ADMIN_TOKEN: change-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phishshield-api
  namespace: phishshield
  labels: {app: phishshield-api}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: phishshield-api}
  template:
    metadata:
      labels: {app: phishshield-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: ghcr.io/khadija-bilal244/phishshieldai/phishshield-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef: {name: phishshield-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
